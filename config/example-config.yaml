git:
  provider: github      # also supports bitbucket (SaaS or private cloud)
  host: github.com      # for GitHub Enterprise, set this to your instance hostname (e.g. github.example.com)
  project: ryclarke     # username or organization name (default project); bare repo names resolve here first
  projects:             # optional list of additional projects to include in catalog, tried in order after the default project
    - other-org
    - another-team
  directory: ./tmp      # directory where repositories are cloned, defaults to $GOPATH/src if set, else the current working directory
  default-branch: main  # fallback if no default branch is configured for a repository
  remote: origin        # remote used by `git push` and `git commit --push`

  commit:
    stage: all          # changes to stage before committing: "all" (includes untracked), "tracked", or "none" (can be overridden with --stage)
    push: false         # if true, automatically push after committing (can be overridden with --push or --no-push)

  update:
    discard: false      # if true, discard uncommitted changes when updating instead of stashing and restoring them (can be overridden with --discard or --stash)
    pull-strategy: default # how to reconcile diverged history: "default", "ff-only", "rebase", or "merge" (can be overridden with --pull-strategy)
    clean-ignored: false   # if true, also delete ignored files when discarding uncommitted changes
    submodules: true       # if true, re-initialize submodules after discarding uncommitted changes

  stash:
    scope: all          # which files to stash: "all" (includes ignored), "untracked", or "tracked" (can be overridden with --scope)

  branch:
    reset: true         # if true, reset branches that already exist instead of failing (can be overridden with --reset or --no-reset)

# Credentials are resolved per project, so each organization can authenticate with a
# different account. No setting here ever holds a credential itself - each one names an
# environment variable, a command, or a gh CLI account to read the credential from.
# Run `batch-tool auth status` to check what each project resolves to.
auth:
  provider: auto        # auto (default), env, gh, command, or none
  env: AUTH_TOKEN       # provider: env - the NAME of the env var holding the token
  # command: []         # provider: command - argv list, run directly without a shell
  # account:            # provider: gh - gh account to use, defaults to the active one

  # per-project overrides, each inheriting any field it doesn't set from above
  owners:
    ryclarke:
      provider: gh      # read from `gh auth token`, requires the GitHub CLI
      account: ryclarke # `gh auth status` lists the available account names
    other-org:
      provider: env
      env: OTHER_ORG_TOKEN
    another-team:
      provider: command # read the token from another tool's stdout
      command: ["op", "read", "op://Private/GitHub/token"]
    public-org:
      provider: none    # make unauthenticated requests

repos:
  sort: true
  skip-archived: true   # if true, exclude archived repositories from selection (default: true)
  skip-unwanted: true   # if true, exclude repositories with any of the specified unwanted labels (default: true)
  unwanted-labels:      # repos with any of these labels are considered unwanted
    - deprecated
    - poc

  # mapping of repository names to custom aliases - members may be bare or project-qualified
  aliases:
    utils:
      - batch-tool
      - other-org/another-repo

  # default individual reviewers per repository or label. repository keys may be bare or
  # project-qualified, and ~label keys apply to all repos carrying that label
  reviewers:
    batch-tool:
      - ryclarke
    other-org/another-repo:
      - alice
      - bob
    ~utils: # applies to all repos in the "utils" label
      - charlie

  team-reviewers: # default team reviewers per repository or label
    ~utils:
      - platform-team

  cache:
    path:               # optional custom path for catalog cache (default: <git.directory>/<git.host>/.batch-tool-cache.json)
    ttl: 24h            # cache time-to-live

channels:
  output-style: tui     # output handler type: "tui" (default, modern terminal UI) or "native" (fallback)
  buffer-size: 100      # channel buffer size for streaming output
  max-concurrency: 8    # maximum number of concurrent operations (defaults to number of logical CPUs)
